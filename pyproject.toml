[project]
name = "flashvsr"
version = "1.1.7"
description = "Towards Real-Time Diffusion-Based Streaming Video Super-Resolution"
readme = "README.md"
requires-python = ">=3.11,<3.12"
dependencies = [
    "accelerate==1.8.1",
    "einops==0.8.1",
    "ftfy==6.3.1",
    "huggingface-hub==0.34.4",
    "imageio==2.37.0",
    "imageio-ffmpeg==0.6.0",
    "modelscope>=1.37,<2",
    "numpy==1.26.4",
    "opencv-python-headless==4.11.0.86",
    "pillow==11.0.0",
    "protobuf==3.20.3",
    "safetensors==0.5.3",
    "sentencepiece==0.2.0",
    "torch==2.6.0",
    "torchaudio==2.6.0",
    "torchvision==0.21.0",
    "tqdm>=4.66,<5",
    "transformers==4.46.2",
]

[project.scripts]
flashvsr-api = "flashvsr_api.cli:main"

[project.optional-dependencies]
api = [
    "fastapi>=0.115,<1",
    "uvicorn[standard]>=0.34,<1",
]
build = [
    "ninja>=1.11,<2",
    "packaging>=24,<27",
]
train = [
    "datasets>=3,<4",
    "pandas==2.3.0",
    "peft==0.16.0",
    "pytorch-lightning==2.5.2",
    "torchmetrics==1.7.3",
    "torchsde==0.2.6",
]
visualization = [
    "matplotlib==3.10.3",
    "opencv-python==4.11.0.86",
]

[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["diffsynth*", "flashvsr_api*"]

[tool.setuptools.package-data]
diffsynth = ["tokenizer_configs/**/*"]

[tool.uv]
index-url = "https://pypi.tuna.tsinghua.edu.cn/simple"

[tool.uv.sources]
torch = { index = "pytorch-cu124" }
torchvision = { index = "pytorch-cu124" }
torchaudio = { index = "pytorch-cu124" }

[[tool.uv.index]]
name = "pytorch-cu124"
url = "https://download.pytorch.org/whl/cu124"
explicit = true
